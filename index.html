<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan to Study | Complete Educational Hub</title>
    <style>
        /* --- Themes --- */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --border-color: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-hover: #9955eb;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button, .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .full-width {
            grid-column: span 2;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--primary-color);
        }

        /* Timer Styles */
        .timer-display {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .timer-btns, .flex-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* AI Doubt Box */
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .ai-response {
            margin-top: 10px;
            padding: 10px;
            background: rgba(74, 144, 226, 0.1);
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }

        /* Notification Badge */
        .notification-icon {
            position: relative;
            cursor: pointer;
            font-size: 20px;
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: red;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body data-theme="light">

    <!-- Header & Controls -->
    <header>
        <div class="logo">📚 Scan to Study</div>
        <div class="nav-controls">
            <div class="notification-icon" onclick="showNotificationAlert()">
                🔔 <span class="badge">1</span>
            </div>
            <button onclick="toggleTheme()">🌓 Theme</button>
            <button onclick="alert('Login / Signup modal can be opened here!')">👤 Login</button>
        </div>
    </header>

    <div class="container">

        <!-- 1. Study Timer (Zero se shuru hone wala) -->
        <div class="card">
            <h2>⏱️ Study Timer (अनंत समय)</h2>
            <div class="timer-display" id="timer">00:00:00</div>
            <div class="timer-btns">
                <button onclick="startTimer()">Start</button>
                <button onclick="pauseTimer()">Pause</button>
                <button onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- 2. Sample Papers & MCQs -->
        <div class="card">
            <h2>📝 Sample Papers & MCQs</h2>
            <p>कक्षा 6 से 12 के लिए अभ्यास सेट और पिछले साल के पेपर्स:</p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <button onclick="window.location.href='#'">📄 Sample Papers डाउनलोड करें</button>
                <button onclick="window.location.href='#'">❓ Daily MCQ Quiz लगाएं</button>
            </div>
        </div>

        <!-- 3. AI Doubt Box (Full Width) -->
        <div class="card full-width">
            <h2>🤖 AI Doubt Solver Box</h2>
            <p>पढ़ाई के दौरान कोई भी सवाल या संदेह हो? यहाँ टाइप करें:</p>
            <textarea id="doubtInput" placeholder="अपना सवाल यहाँ लिखें (जैसे: Photosynthesis क्या है?)..."></textarea>
            <button onclick="askAI()">Ask AI</button>
            <div class="ai-response" id="aiResponse">
                <strong>AI उत्तर:</strong> <span id="aiAnswerText"></span>
            </div>
        </div>

    </div>

    <script>
        // --- Theme Switcher Logic ---
        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
            }
        }

        // --- Timer Logic (0 se start, bina limit ke) ---
        let seconds = 0, minutes = 0, hours = 0;
        let timerInterval = null;
        let isRunning = false;

        function updateTimerDisplay() {
            let h = hours < 10 ? "0" + hours : hours;
            let m = minutes < 10 ? "0" + minutes : minutes;
            let s = seconds < 10 ? "0" + seconds : seconds;
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timerInterval = setInterval(() => {
                    seconds++;
                    if (seconds === 60) {
                        seconds = 0;
                        minutes++;
                    }
                    if (minutes === 60) {
                        minutes = 0;
                        hours++;
                    }
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            seconds = 0;
            minutes = 0;
            hours = 0;
            updateTimerDisplay();
        }

        // --- AI Doubt Mock Logic ---
        function askAI() {
            const query = document.getElementById('doubtInput').value.trim();
            const responseBox = document.getElementById('aiResponse');
            const answerText = document.getElementById('aiAnswerText');

            if(query === "") {
                alert("कृपया पहले अपना सवाल लिखें!");
                return;
            }

            responseBox.style.display = "block";
            answerText.innerText = "सोच रहा हूँ... (यह एक सैंपल रिस्पॉन्स है, आप इसे अपने AI API से जोड़ सकती हैं)";
            
            setTimeout(() => {
                answerText.innerText = `"${query}" का यह बेहतरीन उत्तर है: पढ़ाई करते रहें, कॉन्सेप्ट क्लियर करना सबसे जरूरी है!`;
            }, 1000);
        }

        // --- Notification Alert ---
        function notificationAlert() {
            alert("🔔 नोटिफिकेशन: नया सैंपल पेपर (Class 10 & 12) अपलोड कर दिया गया है!");
        }
        function showNotificationAlert() {
            notificationAlert();
        }
    </script>
</body>
</html>
